<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Đếm ngược</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    color: white;
    background:
        radial-gradient(circle at top, #1d3154, #090b12 55%, #030408);
}

.container {
    width: 90%;
    max-width: 950px;
    padding: 45px 30px;
    text-align: center;
    border-radius: 28px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    box-shadow: 0 25px 80px rgba(0,0,0,0.5);
}

.title {
    font-size: 50px;
    font-weight: bold;
    margin-bottom: 10px;
}

.today {
    font-size: 23px;
    color: #c8d0df;
    text-transform: capitalize;
}

.clock {
    font-size: 75px;
    font-weight: bold;
    letter-spacing: 4px;
    margin: 10px 0 35px;
}

.target {
    color: #aeb8ca;
    font-size: 18px;
    margin-bottom: 20px;
}

.countdown {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
}

.box {
    padding: 25px 10px;
    border-radius: 20px;
    background: rgba(0,0,0,0.25);
    border: 1px solid rgba(255,255,255,0.08);
}

.number {
    font-size: 65px;
    font-weight: bold;
}

.label {
    margin-top: 8px;
    color: #aeb8ca;
    font-size: 14px;
    letter-spacing: 2px;
}

.done {
    display: none;
    font-size: 45px;
    font-weight: bold;
}

.footer {
    margin-top: 30px;
    color: #707b8f;
    font-size: 13px;
}

@media (max-width: 650px) {
    .countdown {
        grid-template-columns: repeat(2, 1fr);
    }

    .title {
        font-size: 38px;
    }

    .clock {
        font-size: 50px;
    }

    .number {
        font-size: 45px;
    }
}
    .music-btn {
    margin-top: 25px;
    padding: 14px 28px;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 50px;
    background: rgba(255,255,255,0.1);
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    backdrop-filter: blur(10px);
    transition: 0.25s;
}

.music-btn:hover {
    transform: scale(1.06);
    background: rgba(255,255,255,0.18);
}
</style>
</head>

<body>

<div class="container">

    <div class="title">⏳ ĐẾM NGƯỢC</div>

    <div class="today" id="today">
        Đang tải...
    </div>

    <div class="clock" id="clock">
        00:00:00
    </div>

    <div class="target">
        Đếm ngược đến <b>16:00 ngày 30/08/2026</b>
    </div>

    <div class="countdown" id="countdown">

        <div class="box">
            <div class="number" id="days">00</div>
            <div class="label">NGÀY</div>
        </div>

        <div class="box">
            <div class="number" id="hours">00</div>
            <div class="label">GIỜ</div>
        </div>

        <div class="box">
            <div class="number" id="minutes">00</div>
            <div class="label">PHÚT</div>
        </div>

        <div class="box">
            <div class="number" id="seconds">00</div>
            <div class="label">GIÂY</div>
        </div>

    </div>

    <div class="done" id="done">
        🎉 ĐÃ ĐẾN GIỜ!
    </div>

    <div class="footer">
        Đồng hồ sử dụng thời gian trên thiết bị của người xem.
    </div>

</div>

<script>

const target = new Date(2026, 7, 30, 16, 0, 0);

function pad(number) {
    return String(number).padStart(2, "0");
}

function update() {

    const now = new Date();

    // Ngày hiện tại
    document.getElementById("today").textContent =
        new Intl.DateTimeFormat("vi-VN", {
            weekday: "long",
            day: "2-digit",
            month: "2-digit",
            year: "numeric"
        }).format(now);

    // Giờ hiện tại
    document.getElementById("clock").textContent =
        pad(now.getHours()) + ":" +
        pad(now.getMinutes()) + ":" +
        pad(now.getSeconds());

    // Thời gian còn lại
    const difference = target - now;

    if (difference <= 0) {

        document.getElementById("countdown").style.display = "none";
        document.getElementById("done").style.display = "block";

        return;
    }

    const totalSeconds = Math.floor(difference / 1000);

    const days = Math.floor(totalSeconds / 86400);

    const hours =
        Math.floor((totalSeconds % 86400) / 3600);

    const minutes =
        Math.floor((totalSeconds % 3600) / 60);

    const seconds =
        totalSeconds % 60;

    document.getElementById("days").textContent = pad(days);
    document.getElementById("hours").textContent = pad(hours);
    document.getElementById("minutes").textContent = pad(minutes);
    document.getElementById("seconds").textContent = pad(seconds);
}

update();

setInterval(update, 1000);

</script>
<audio id="music" loop>
    <source src="./tiktok_music_7659756332714609940.mp3" type="audio/mpeg">
</audio>

<button class="music-btn" id="musicBtn">🎵 Bật nhạc</button>

<script>
const music = document.getElementById("music");
const musicBtn = document.getElementById("musicBtn");

musicBtn.addEventListener("click", function () {
    if (music.paused) {
        music.play().then(() => {
            musicBtn.textContent = "🔇 Tắt nhạc";
        }).catch(error => {
            console.log("Không thể phát nhạc:", error);
        });
    } else {
        music.pause();
        musicBtn.textContent = "🎵 Bật nhạc";
    }
});
</script>
</body>
</html>
