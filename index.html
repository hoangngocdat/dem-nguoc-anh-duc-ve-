<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Đếm ngược - Anh Đức về nhà</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    color: white;
    background:
        radial-gradient(circle at top, #1d3154, #090b12 55%, #030408);
    overflow-x: hidden;
}

.container {
    width: 90%;
    max-width: 950px;
    padding: 45px 30px;
    text-align: center;
    border-radius: 28px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    box-shadow: 0 25px 80px rgba(0,0,0,0.5);
    position: relative;
    z-index: 2;
}

/* =========================
   CHÀO MỪNG
========================= */

.welcome {
    font-size: 30px;
    font-weight: bold;
    margin-bottom: 15px;
    color: #e6edf8;
    letter-spacing: 1px;
}

/* =========================
   TIÊU ĐỀ
========================= */

.title {
    font-size: 44px;
    font-weight: bold;
    margin-bottom: 10px;
}

/* =========================
   NGÀY
========================= */

.today {
    font-size: 23px;
    color: #c8d0df;
    text-transform: capitalize;
}

/* =========================
   ĐỒNG HỒ
========================= */

.clock {
    font-size: 75px;
    font-weight: bold;
    letter-spacing: 4px;
    margin: 10px 0 35px;
}

/* =========================
   MỤC TIÊU
========================= */

.target {
    color: #aeb8ca;
    font-size: 18px;
    margin-bottom: 20px;
}

/* =========================
   ĐẾM NGƯỢC
========================= */

.countdown {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
}

.box {
    padding: 25px 10px;
    border-radius: 20px;
    background: rgba(0,0,0,0.25);
    border: 1px solid rgba(255,255,255,0.08);
}

.number {
    font-size: 65px;
    font-weight: bold;
}

.label {
    margin-top: 8px;
    color: #aeb8ca;
    font-size: 14px;
    letter-spacing: 2px;
}

/* =========================
   ĐÃ ĐẾN GIỜ
========================= */

.done {
    display: none;
    font-size: 45px;
    font-weight: bold;
}

/* =========================
   NÚT NHẠC
========================= */

.music-btn {
    display: block;
    margin: 25px auto 0;
    padding: 14px 30px;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 50px;
    background: rgba(255,255,255,0.1);
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    backdrop-filter: blur(10px);
    box-shadow: 0 8px 25px rgba(0,0,0,0.25);
    transition: 0.25s;
}

.music-btn:hover {
    transform: scale(1.06);
    background: rgba(255,255,255,0.18);
}

.music-btn:active {
    transform: scale(0.96);
}

/* =========================
   FOOTER
========================= */

.footer {
    margin-top: 25px;
    color: #707b8f;
    font-size: 13px;
}

/* =========================
   PHÁO HOA
========================= */

.firework {
    position: fixed;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 9999;
}

.particle {
    position: absolute;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    pointer-events: none;
    animation: explode 900ms ease-out forwards;
}

@keyframes explode {

    0% {
        transform:
            translate(0, 0)
            scale(1);
        opacity: 1;
    }

    100% {
        transform:
            translate(var(--x), var(--y))
            scale(0);
        opacity: 0;
    }
}

/* =========================
   ĐIỆN THOẠI
========================= */

@media (max-width: 650px) {

    .container {
        padding: 35px 20px;
    }

    .welcome {
        font-size: 22px;
        margin-bottom: 12px;
    }

    .countdown {
        grid-template-columns: repeat(2, 1fr);
    }

    .title {
        font-size: 34px;
    }

    .clock {
        font-size: 50px;
    }

    .number {
        font-size: 45px;
    }

    .today {
        font-size: 18px;
    }

    .target {
        font-size: 16px;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- CHÀO MỪNG -->
    <div class="welcome">
        🎉 CHÀO MỪNG NGÀY ANH ĐỨC VỀ NHÀ 🎉
    </div>

    <!-- TIÊU ĐỀ -->
    <div class="title">
        🕐 ĐẾM NGƯỢC 🕐
    </div>

    <!-- NGÀY HIỆN TẠI -->
    <div class="today" id="today">
        Đang tải...
    </div>

    <!-- GIỜ HIỆN TẠI -->
    <div class="clock" id="clock">
        00:00:00
    </div>

    <!-- THỜI GIAN ĐÍCH -->
    <div class="target">
        Đếm ngược đến <b>16:00 ngày 30/08/2026</b>
    </div>

    <!-- 4 Ô ĐẾM NGƯỢC -->
    <div class="countdown" id="countdown">

        <div class="box">
            <div class="number" id="days">00</div>
            <div class="label">NGÀY</div>
        </div>

        <div class="box">
            <div class="number" id="hours">00</div>
            <div class="label">GIỜ</div>
        </div>

        <div class="box">
            <div class="number" id="minutes">00</div>
            <div class="label">PHÚT</div>
        </div>

        <div class="box">
            <div class="number" id="seconds">00</div>
            <div class="label">GIÂY</div>
        </div>

    </div>

    <!-- NHẠC -->
    <audio id="music" loop>
        <source src="./tiktok_music_7659756332714609940.mp3" type="audio/mpeg">
    </audio>

    <!-- NÚT NHẠC -->
    <button class="music-btn" id="musicBtn">
        🎵 Bật nhạc
    </button>

    <!-- ĐÃ ĐẾN GIỜ -->
    <div class="done" id="done">
        🎉 ĐÃ ĐẾN GIỜ!
    </div>

    <!-- FOOTER -->
    <div class="footer">
        Đồng hồ sử dụng thời gian trên thiết bị của người xem.
    </div>

</div>

<script>

/* =========================
   ĐẾM NGƯỢC
========================= */

const target = new Date(2026, 7, 30, 16, 0, 0);

function pad(number) {
    return String(number).padStart(2, "0");
}

function update() {

    const now = new Date();

    // Ngày hiện tại
    document.getElementById("today").textContent =
        new Intl.DateTimeFormat("vi-VN", {
            weekday: "long",
            day: "2-digit",
            month: "2-digit",
            year: "numeric"
        }).format(now);

    // Giờ hiện tại
    document.getElementById("clock").textContent =
        pad(now.getHours()) + ":" +
        pad(now.getMinutes()) + ":" +
        pad(now.getSeconds());

    // Thời gian còn lại
    const difference = target - now;

    if (difference <= 0) {

        document.getElementById("countdown").style.display = "none";
        document.getElementById("done").style.display = "block";

        return;
    }

    const totalSeconds =
        Math.floor(difference / 1000);

    const days =
        Math.floor(totalSeconds / 86400);

    const hours =
        Math.floor((totalSeconds % 86400) / 3600);

    const minutes =
        Math.floor((totalSeconds % 3600) / 60);

    const seconds =
        totalSeconds % 60;

    document.getElementById("days").textContent =
        pad(days);

    document.getElementById("hours").textContent =
        pad(hours);

    document.getElementById("minutes").textContent =
        pad(minutes);

    document.getElementById("seconds").textContent =
        pad(seconds);
}

update();

setInterval(update, 1000);


/* =========================
   BẬT / TẮT NHẠC
========================= */

const music =
    document.getElementById("music");

const musicBtn =
    document.getElementById("musicBtn");

musicBtn.addEventListener(
    "click",
    async function () {

        if (music.paused) {

            try {

                await music.play();

                musicBtn.textContent =
                    "🔇 Tắt nhạc";

            } catch (error) {

                console.log(
                    "Không thể phát nhạc:",
                    error
                );

            }

        } else {

            music.pause();

            musicBtn.textContent =
                "🎵 Bật nhạc";
        }
    }
);


/* =========================
   PHÁO HOA KHI BẤM
========================= */

document.addEventListener("click", function(event) {

    // Không bắn pháo hoa khi bấm nút nhạc
    if (event.target.closest(".music-btn")) {
        return;
    }

    createFirework(event.clientX, event.clientY);

});


/* =========================
   TẠO PHÁO HOA
========================= */

function createFirework(x, y) {

    const firework =
        document.createElement("div");

    firework.className = "firework";

    firework.style.left = x + "px";
    firework.style.top = y + "px";

    document.body.appendChild(firework);

    const particleCount = 35;

    for (let i = 0; i < particleCount; i++) {

        const particle =
            document.createElement("div");

        particle.className = "particle";

        const angle =
            Math.random() * Math.PI * 2;

        const distance =
            40 + Math.random() * 100;

        const moveX =
            Math.cos(angle) * distance;

        const moveY =
            Math.sin(angle) * distance;

        particle.style.setProperty(
            "--x",
            moveX + "px"
        );

        particle.style.setProperty(
            "--y",
            moveY + "px"
        );

        // Mỗi hạt có kích thước ngẫu nhiên
        const size =
            3 + Math.random() * 4;

        particle.style.width =
            size + "px";

        particle.style.height =
            size + "px";

        // Màu ngẫu nhiên
        const colors = [
            "#ffffff",
            "#ffd166",
            "#ff6b6b",
            "#74c0fc",
            "#69db7c",
            "#e599f7"
        ];

        particle.style.background =
            colors[
                Math.floor(
                    Math.random() * colors.length
                )
            ];

        firework.appendChild(particle);
    }

    // Xóa pháo hoa sau khi hiệu ứng kết thúc
    setTimeout(function() {
        firework.remove();
    }, 1000);
}

</script>

</body>
</html>
